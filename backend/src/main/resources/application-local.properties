# =======================================================
# LOCAL DEVELOPMENT CONFIGURATION (IntelliJ / Maven)
# =======================================================
# This file is loaded automatically when the active profile is 'local'.
# It overrides the placeholders in application.properties.

# --- Database (Connect to Docker container on localhost) ---
# Assumes you are running 'docker-compose up -d postgres'
spring.datasource.url=jdbc:postgresql://localhost:5432/riskdb
spring.datasource.username=admin
spring.datasource.password=admin
spring.jpa.hibernate.ddl-auto=create-drop

# --- Keycloak / Security ---
# Assumes you are running 'docker-compose up -d keycloak' (Port 9080)

# Resource ID & Credentials
jwt.auth.converter.resource-id=rea-backend
spring.security.oauth2.client.registration.keycloak.client-id=rea-backend
spring.security.oauth2.client.registration.keycloak.client-secret=api-client-secret

# URLs (Point to localhost:9080)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9080/auth/realms/rea-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9080/auth/realms/rea-realm/protocol/openid-connect/certs

# --- Keycloak Admin Client ---
keycloak.realm=rea-realm
keycloak.admin.username=admin
keycloak.admin.password=admin
keycloak.auth-server-url=http://localhost:9080/auth

# --- Application Logic ---
app.setup.load-sample-data=true

# --- Swagger UI OAuth ---
springdoc.swagger-ui.oauth.clientId=rea-backend
springdoc.swagger-ui.oauth.clientSecret=api-client-secret

# --- Debugging Logs ---

# 1. See incoming HTTP requests and responses (Url, Headers, Parameters)
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet=DEBUG

# 2. See the actual SQL queries being executed
logging.level.org.hibernate.SQL=DEBUG

# 3. See the parameters passed to the SQL queries (e.g., ?, ?)
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# 4. See your application's specific logs (Services/Controllers)
# Replace 'org.bihealth.mi.risk_assessment_api' with your actual root package name
logging.level.org.bihealth.mi.risk_assessment_api=DEBUG

# 5. See Security failures (e.g. 403 Forbidden)
logging.level.org.springframework.security=DEBUG