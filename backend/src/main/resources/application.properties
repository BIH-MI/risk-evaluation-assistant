# ===================================================================
# CORE APPLICATION SETTINGS
# ===================================================================
spring.application.name=rea-backend
# The internal port the container listens on (mapped by Docker)
server.port=8080
# Default profile is 'local' unless overridden by Docker
spring.profiles.active=${ACTIVE_PROFILE:local}

# ===================================================================
# DATABASE & HIBERNATE
# ===================================================================
# URL, User, and Password are injected via Docker Environment Variables.

# Use PostgreSQL Dialect for generating SQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Efficient handling of Large Objects (LOBs) in PostgreSQL
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# SQL statements are logged by the local profile only (application-local.properties).
spring.jpa.show-sql=false

# Hibernate creates the schema from the JPA entities on a fresh database and
# adds missing tables/columns on later starts; it never drops data. Override
# with SPRING_JPA_HIBERNATE_DDL_AUTO. Never use create/create-drop against a
# database whose data must be kept.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# ===================================================================
# SECURITY & KEYCLOAK (OIDC)
# ===================================================================
# Backend acts as an OAuth2 Resource Server.
# URLs (Issuer, JWK Set) are injected via Docker Environment Variables.

# Scopes to request when acting as a client
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email

# JWT Converter: Use 'preferred_username' from the token as the principal
jwt.auth.converter.principal-attribute=preferred_username

# Resource ID for Role Mapping (matches Keycloak Client ID)
# Injected via: JWT_AUTH_CONVERTER_RESOURCE_ID
jwt.auth.converter.resource-id=${JWT_AUTH_CONVERTER_RESOURCE_ID}

# ===================================================================
# KEYCLOAK ADMIN CLIENT
# ===================================================================
# Used by the backend to programmatically manage users/roles.
# Credentials/Realm are injected via Docker Environment Variables.

keycloak.admin.client-id=admin-cli

# ===================================================================
# LOGGING & METRICS
# ===================================================================
# Expose health and info endpoints only
management.endpoints.web.exposure.include=health,info

# Log Levels
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework=ERROR

# Log file location inside the container
logging.file.name=logs/risk-assessment-app.log

# ===================================================================
# STARTUP DATA
# ===================================================================
# Risk frameworks, the default attribute scoring system and the default QID
# discovery configuration are always created when missing. Demo records
# (LEOSS dataset, recipients, assessments, activities) only when enabled.
app.setup.load-sample-data=${APP_SETUP_LOAD_SAMPLE_DATA:false}

# ===================================================================
# SWAGGER / OPENAPI
# ===================================================================
# Handle X-Forwarded- headers from Nginx correctly
server.forward-headers-strategy=framework

# Browser-local AI models: persistent storage of installed model files, the
# only source they are downloaded from (pinned revisions, verified hashes), and
# the hosts the source may redirect to (subdomains included; HTTPS only).
app.ai-models.storage-dir=${AI_MODELS_STORAGE_DIR:ai-models}
app.ai-models.source-url=${AI_MODELS_SOURCE_URL:https://huggingface.co}
app.ai-models.redirect-hosts=${AI_MODELS_REDIRECT_HOSTS:huggingface.co,hf.co}

# Load OpenAPI config from the API path to support reverse proxying
springdoc.swagger-ui.configUrl=/api/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/api/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true
# "Try it out" uses a bearer token pasted into Swagger UI (OpenApiConfig).
# No OAuth client settings here: they would be sent to the browser.