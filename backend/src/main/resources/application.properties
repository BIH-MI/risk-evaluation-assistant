# ===================================================================
# CORE APPLICATION SETTINGS
# ===================================================================
spring.application.name=rea-backend
# The internal port the container listens on (mapped by Docker)
server.port=8080
# Default profile is 'local' unless overridden by Docker
spring.profiles.active=${ACTIVE_PROFILE:local}

# ===================================================================
# DATABASE & HIBERNATE
# ===================================================================
# URL, User, and Password are injected via Docker Environment Variables.

# Use PostgreSQL Dialect for generating SQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Efficient handling of Large Objects (LOBs) in PostgreSQL
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Show SQL in logs (Set to false in production if logs are too noisy)
spring.jpa.show-sql=true

# Schema management (create-drop vs update) is managed via:
# Env Var: SPRING_JPA_HIBERNATE_DDL_AUTO

# ===================================================================
# SECURITY & KEYCLOAK (OIDC)
# ===================================================================
# Backend acts as an OAuth2 Resource Server.
# URLs (Issuer, JWK Set) are injected via Docker Environment Variables.

# Scopes to request when acting as a client
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email

# JWT Converter: Use 'preferred_username' from the token as the principal
jwt.auth.converter.principal-attribute=preferred_username

# Resource ID for Role Mapping (matches Keycloak Client ID)
# Injected via: JWT_AUTH_CONVERTER_RESOURCE_ID
jwt.auth.converter.resource-id=${JWT_AUTH_CONVERTER_RESOURCE_ID}

# ===================================================================
# KEYCLOAK ADMIN CLIENT
# ===================================================================
# Used by the backend to programmatically manage users/roles.
# Credentials/Realm are injected via Docker Environment Variables.

keycloak.admin.client-id=admin-cli

# ===================================================================
# LOGGING & METRICS
# ===================================================================
# Expose health and info endpoints
management.endpoints.web.exposure.include=*

# Log Levels
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework=ERROR

# Log file location inside the container
logging.file.name=logs/risk-assessment-app.log

# ===================================================================
# DATA LOADER SETTINGS
# ===================================================================
# Force update of Questionnaire structure (Questions/Weights) from JSON on startup
app.setup.update-thresholds=true
app.setup.update-questions=true

# Sample Data Loading (Demo Users/Projects) is managed via:
# Env Var: APP_SETUP_LOAD_SAMPLE_DATA

# ===================================================================
# SWAGGER / OPENAPI
# ===================================================================
# Handle X-Forwarded- headers from Nginx correctly
server.forward-headers-strategy=framework

# Load OpenAPI config from the API path to support reverse proxying
springdoc.swagger-ui.configUrl=/api/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/api/v3/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true

# OAuth2 Configuration for "Try it out" in Swagger UI
# Uses the same environment variables as the main security config
springdoc.swagger-ui.oauth.clientId=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_ID}
springdoc.swagger-ui.oauth.clientSecret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET}