version: "3.8"

services:
  # =======================================================
  # KEYCLOAK IDENTITY PROVIDER
  # =======================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.1
    container_name: keycloak-rea
    # Start in dev mode and import the realm configuration on startup
    command: ["start-dev", "--import-realm"]
    restart: unless-stopped
    environment:
      # Connect Keycloak to the Postgres Service
      - DB_VENDOR=postgres
      - DB_ADDR=postgres
      - DB_DATABASE=${POSTGRES_DB_NAME}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}

      # Create the initial Admin User
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USER}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}

      # Configure Hostname and Proxy behavior
      - KC_HOSTNAME=${KC_HOSTNAME}
      - KC_HOSTNAME_ADMIN=${KC_HOSTNAME}
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME_STRICT_HTTPS=false
      - KC_PROXY_HEADERS=xforwarded
      - KC_HTTP_RELATIVE_PATH=/auth

      # Proxy Settings
      - NO_PROXY=${NO_PROXY}
      - no_proxy=${NO_PROXY}

      # Import the realm JSON file defined in .env (local vs prod)
      - KEYCLOAK_IMPORT=/opt/keycloak/data/import/${KC_REALM_FILE}
    ports:
      - "9080:8080" # Maps container port 8080 to host port 9080
    volumes:
      # Mount the specific realm config file into the container
      - ./keycloak/${KC_REALM_FILE}:/opt/keycloak/data/import/${KC_REALM_FILE}
    depends_on:
      - postgres
    networks:
      - rea-network

  # =======================================================
  # POSTGRESQL DATABASE
  # =======================================================
  postgres:
    image: postgres:16.3-alpine
    container_name: postgres-rea
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      # Persist database data to a local folder './pgdata'
      - ./pgdata:/var/lib/postgresql/data
    networks:
      - rea-network

  # =======================================================
  # SPRING BOOT BACKEND
  # =======================================================
  spring-boot-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # Pass Proxy/Maven settings to the build process
        MAVEN_OPTS: ${MAVEN_OPTS}
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
    container_name: spring-boot-rea
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=container
      - NO_PROXY=${NO_PROXY}
      - no_proxy=${NO_PROXY}

      # Inject Database Connection Details
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      # Construct JDBC URL dynamically using the Service Name 'postgres'
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB_NAME}

      # Database Schema Management (Update vs Create-Drop)
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO}

      # Keycloak OIDC Settings
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_ID=${REA_BACKEND_CLIENT_ID}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET=${REA_BACKEND_CLIENT_SECRET}
      - JWT_AUTH_CONVERTER_RESOURCE_ID=${REA_BACKEND_CLIENT_ID}

      # Keycloak Admin Settings (for User Management)
      - KEYCLOAK_REALM=${KEYCLOAK_REALM_NAME}
      - KEYCLOAK_ADMIN_USERNAME=${KEYCLOAK_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}

      # Dynamic Keycloak URLs
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=${KC_HOSTNAME}/realms/${KEYCLOAK_REALM_NAME}
      # Internal Docker URL for JWK Set (Direct container-to-container communication)
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/auth/realms/${KEYCLOAK_REALM_NAME}/protocol/openid-connect/certs
      - KEYCLOAK_AUTH_SERVER_URL=http://keycloak:8080/auth

      # Application Logic (Sample Data Loading)
      - APP_SETUP_LOAD_SAMPLE_DATA=${APP_SETUP_LOAD_SAMPLE_DATA}
      - APP_SETUP_UPDATE_THRESHOLDS=${APP_SETUP_UPDATE_THRESHOLDS}
      - APP_SETUP_UPDATE_QUESTIONS=${APP_SETUP_UPDATE_QUESTIONS}

    restart: unless-stopped
    depends_on:
      - postgres
      - keycloak
    networks:
      - rea-network

  # =======================================================
  # REACT FRONTEND
  # =======================================================
  react-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Pass Proxy settings for 'npm install'
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}

        # Inject OIDC & API settings into the build (baked into static JS)
        REACT_APP_API_URL: ${APP_URL}
        REACT_APP_OIDC_AUTHORITY: ${KC_HOSTNAME}/realms/${KEYCLOAK_REALM_NAME}
        REACT_APP_OIDC_CLIENT_ID: rea-frontend
        REACT_APP_OIDC_REDIRECT_URI: ${APP_URL}/
        REACT_APP_OIDC_POST_LOGOUT_REDIRECT_URI: ${APP_URL}/
    container_name: react-rea
    networks:
      - rea-network

  # =======================================================
  # NGINX REVERSE PROXY
  # =======================================================
  nginx:
    image: nginx:latest
    container_name: nginx-rea
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS
    depends_on:
      - react-app
      - spring-boot-app
      - keycloak
    volumes:
      # Mount dynamic configuration file (localhost.conf OR default.conf)
      - ./nginx/conf.d/${NGINX_CONF_FILE}:/etc/nginx/conf.d/default.conf
      # Mount SSL certificates (Read-only)
      - ./nginx/certs:/etc/nginx/certs:ro
    environment:
      - NO_PROXY=${NO_PROXY}
      - no_proxy=${NO_PROXY}
    networks:
      - rea-network

networks:
  rea-network:
    driver: bridge

volumes:
  postgres-data:
