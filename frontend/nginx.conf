server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ONNX Runtime WASM files for the browser-local AI classifier (model files
    # are served by the backend). No SPA fallback: a missing file must be a
    # 404, not index.html. Paths are not versioned, so clients revalidate.
    location /ai-assets/ {
        try_files $uri =404;
        types {
            application/wasm wasm;
            text/javascript mjs;
        }
        add_header Cache-Control "no-cache";
        gzip on;
        gzip_types application/wasm;
    }
}