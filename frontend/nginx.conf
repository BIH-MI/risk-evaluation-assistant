server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Self-hosted AI model, tokenizer and ONNX Runtime WASM files. No SPA
    # fallback here: a missing file must be a 404, not index.html. Paths are
    # not versioned, so clients revalidate (ETag) instead of caching blindly.
    location /ai-assets/ {
        try_files $uri =404;
        types {
            application/json json;
            application/wasm wasm;
            text/javascript mjs;
            application/octet-stream onnx;
        }
        add_header Cache-Control "no-cache";
        gzip on;
        gzip_types application/json application/wasm;
    }
}