# =======================================================
# HTTP -> HTTPS REDIRECT
# =======================================================
server {
    listen 80;
    server_name s-bih-rea-app.charite.de;
    return 301 https://$host$request_uri;
}

# =======================================================
# HTTPS SERVER (Production)
# =======================================================
server {
    listen 443 ssl;
    server_name s-bih-rea-app.charite.de;

    # --- TLS Certificates ---
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # --- SSL Security Settings ---
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 1. SERVE REACT FRONTEND (Default)
    root /usr/share/nginx/html;
    index index.html;
    
    location / {
        proxy_pass http://react-app:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }

    # 2. PROXY API REQUESTS (Spring Boot)
    location /api/ {
        proxy_pass http://spring-boot-app:8080; 

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /api;

        # Keep connection alive for performance
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 3. PROXY AUTHENTICATION (Keycloak)
    # Handles /auth/ path for login/tokens
    location /auth/ {
        proxy_pass http://keycloak:8080/auth/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        
        # Increase buffer size for large headers (common in OIDC)
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # --- GZIP Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml application/xml+rss;
}
